<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ucm-gabarit" content="{{gabarit}}">
<title>Guide : {{titre}}</title>
<style>
:root {
  color-scheme: light;
  --fond: #f6f6f3;
  --surface: #ffffff;
  --surface-haute: #eeeee9;
  --bord: #d8d8d0;
  --texte: #1c1e1b;
  --discret: #575c55;
  --accent: #1d5bb8;
  --ok: #1b6a34;
  --alerte: #8a4f00;
  --erreur: #b0261c;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--fond); color: var(--texte); font: 15px/1.55 system-ui, "Segoe UI", sans-serif; }
.page { max-width: 1120px; margin: 0 auto; padding: 32px 24px 96px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; }
h2 { font-size: 20px; margin: 0 0 6px; }
h2 .n { color: var(--discret); font-weight: 400; margin-right: 8px; }
h3 { font-size: 15px; margin: 0; }
section { margin-top: 48px; scroll-margin-top: 16px; }
.chapeau { color: var(--discret); max-width: 72ch; margin: 0 0 18px; }
p { margin: 0 0 10px; }
ul, ol { margin: 0; padding-left: 20px; }
li { margin-bottom: 4px; }
a { color: var(--accent); }
a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 13px; }
.resume { max-width: 72ch; color: var(--discret); margin: 0 0 6px; }
.discret { color: var(--discret); }
.tag { display: inline-block; margin: 0 4px 2px 0; padding: 0 6px; border-radius: 4px; background: var(--surface-haute); color: var(--discret); font-size: 12px; }

/* Galerie : une carte par système, sa scène sur fond blanc, puis ses points. */
.galerie { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); gap: 16px; }
.systeme { background: var(--surface); border: 1px solid var(--bord); border-radius: 8px; overflow: hidden; min-width: 0; scroll-margin-top: 16px; }
.systeme > header { padding: 12px 16px 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.paquets { font-family: var(--mono); font-size: 12px; color: var(--discret); }
.scene { border-block: 1px solid var(--bord); background: #ffffff; }
.scene iframe { display: block; width: 100%; height: 420px; border: 0; }
.systeme ol { padding: 12px 16px 12px 34px; }
.systeme .note { padding: 0 16px 14px; font-size: 13px; color: var(--discret); margin: 0; }
.absent { background: transparent; border-style: dashed; align-self: start; }
.absent p { padding: 0 16px 14px; margin: 0; color: var(--discret); }

/* Ce qu'il faut comprendre */
.differences { display: grid; gap: 12px; }
.diff { background: var(--surface); border: 1px solid var(--bord); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; }
.diff > p { margin: 0; max-width: 72ch; }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.options > div { border-left: 3px solid var(--bord); padding: 2px 0 2px 10px; display: grid; gap: 2px; }
.options b { font-weight: 600; }
.options span { font-size: 14px; color: var(--discret); }
.decider { border-left: 3px solid var(--accent); background: var(--surface-haute); padding: 8px 12px; border-radius: 0 6px 6px 0; margin: 0; max-width: 80ch; }
.decider b { color: var(--accent); }

/* À dessiner */
.table-wrap { overflow-x: auto; margin: 10px 0 12px; border: 1px solid var(--bord); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--bord); }
tr:last-child td { border-bottom: 0; }
th { background: var(--surface-haute); color: var(--discret); font-weight: 600; white-space: nowrap; }
td.oui { color: var(--ok); font-weight: 600; }
td.si { color: var(--alerte); }
td.non { color: var(--discret); }
.dessin h3 { margin-top: 18px; }
.proprietes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; margin-top: 10px; }
.prop { background: var(--surface); border: 1px solid var(--bord); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.prop .valeurs { font-family: var(--mono); font-size: 13px; color: var(--discret); }

details { margin: 0 0 12px; }
summary { cursor: pointer; color: var(--accent); padding: 4px 0; }
</style>
</head>
<body>
<div class="page">
<h1>{{titre}}</h1>
<p class="resume">{{resume}}</p>
<p class="discret">Guide de composant, gabarit {{gabarit}}, du {{date}}. Page produite par <code>guide.ts rendre</code> ; ne pas la modifier à la main.</p>

<section id="galerie">
<h2><span class="n">1</span>Galerie</h2>
<!-- @@galerie@@ -->
</section>

<section id="comprendre">
<h2><span class="n">2</span>Ce qu'il faut comprendre</h2>
<!-- @@comprendre@@ -->
</section>

<section id="dessiner">
<h2><span class="n">3</span>À dessiner</h2>
<!-- @@dessiner@@ -->
</section>

<section id="questions">
<h2>Questions</h2>
<!-- @@questions@@ -->
</section>

<section id="sources">
<h2>Sources</h2>
<!-- @@sources@@ -->
</section>
</div>
<script>
  // Chaque scène annonce sa hauteur ; son cadre la prend pour ne jamais défiler.
  addEventListener('message', (e) => {
    if (!e.data || typeof e.data.hauteur !== 'number') return;
    for (const f of document.querySelectorAll('.scene iframe')) {
      if (f.contentWindow === e.source) f.style.height = `${e.data.hauteur}px`;
    }
  });
</script>
</body>
</html>
